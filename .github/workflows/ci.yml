name: Astro site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run astro -- sync
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s ops/tests
      - name: Build the configured preview enquiry mode
        run: npm run build
        env:
          PUBLIC_ENQUIRY_MODE: ${{ vars.PREVIEW_ENQUIRY_MODE || 'mailgun' }}
          PUBLIC_HUB_INQUIRY_BASE: ${{ vars.PREVIEW_HUB_INQUIRY_BASE }}
          PUBLIC_ENQUIRY_ENDPOINT: ${{ vars.PREVIEW_ENQUIRY_ENDPOINT || '/api/enquiries' }}
      - run: npm run check:links
      - run: npm run check:sitemap
      - run: npm run check:content
      - name: Package verified preview build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/_release.json
          tar -C dist -czf site.tar.gz .
          sha256sum site.tar.gz > site.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ashbi-preview-${{ github.sha }}
          path: |
            site.tar.gz
            site.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
